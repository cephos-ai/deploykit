<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Slack panel -->
  <rect x="8" y="40" width="424" height="320" rx="12" fill="#ffffff" stroke="#dddde1"/>
  <text x="32" y="74" font-size="13" font-weight="700" fill="#616168"># deploy-acme</text>

  <!-- FDE message -->
  <rect x="32" y="92" width="36" height="36" rx="8" fill="#2eb67d"/>
  <text x="50" y="116" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <text x="80" y="106" font-size="14" font-weight="700" fill="#1d1c1d">Sofia<tspan font-size="11" font-weight="400" fill="#616168" dx="8">4:02 PM</tspan></text>
  <text x="80" y="128" font-size="13" fill="#1d1c1d"><tspan fill="#1264a3" font-weight="600">@deploybot</tspan> ingest silently skipped another</text>
  <text x="80" y="146" font-size="13" fill="#1d1c1d">batch of scans, looks like the rotated-page</text>
  <text x="80" y="164" font-size="13" fill="#1d1c1d">thing again</text>

  <!-- thread indent line -->
  <line x1="50" y1="188" x2="50" y2="312" stroke="#dddde1" stroke-width="2"/>

  <!-- bot reply -->
  <rect x="80" y="200" width="36" height="36" rx="8" fill="#611f69"/>
  <text x="98" y="224" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">d</text>
  <text x="128" y="214" font-size="14" font-weight="700" fill="#1d1c1d">deploybot</text>
  <rect x="200" y="203" width="32" height="15" rx="3" fill="#e8e8e8"/>
  <text x="216" y="214" font-size="9" font-weight="700" fill="#616168" text-anchor="middle">APP</text>
  <text x="240" y="214" font-size="11" fill="#616168">4:03 PM</text>
  <text x="128" y="238" font-size="13" fill="#1d1c1d">+1 on <tspan font-weight="700">PLT-142</tspan> (same root cause)</text>
  <text x="128" y="256" font-size="13" fill="#1d1c1d">OCR fails on rotated scans</text>
  <text x="128" y="280" font-size="12" fill="#1264a3">linear.app/acme-ai/issue/PLT-142</text>

  <!-- arrow -->
  <line x1="444" y1="200" x2="492" y2="200" stroke="#8b8f98" stroke-width="2.5"/>
  <polygon points="492,193 504,200 492,207" fill="#8b8f98"/>

  <!-- Linear panel -->
  <rect x="512" y="8" width="440" height="384" rx="12" fill="#17181c" stroke="#2c2d33"/>
  <rect x="536" y="30" width="66" height="20" rx="4" fill="#26272e"/>
  <text x="569" y="44" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#9da2ae" text-anchor="middle">PLT-142</text>
  <text x="536" y="80" font-size="17" font-weight="700" fill="#f7f8f8">OCR fails on rotated scans</text>
  <line x1="536" y1="98" x2="928" y2="98" stroke="#2c2d33"/>
  <text x="536" y="124" font-size="11" font-weight="600" fill="#6b6f76" letter-spacing="1">ACTIVITY</text>

  <!-- occurrence comments -->
  <rect x="536" y="138" width="392" height="44" rx="6" fill="#1e1f25"/>
  <text x="552" y="157" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#9da2ae">[occurrence] deployment: acme &#183; source: slack</text>
  <text x="552" y="173" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#6b6f76">2026-06-24</text>

  <rect x="536" y="192" width="392" height="44" rx="6" fill="#1e1f25"/>
  <text x="552" y="211" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#9da2ae">[occurrence] deployment: globex &#183; source: retro</text>
  <text x="552" y="227" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#6b6f76">2026-07-01</text>

  <rect x="536" y="246" width="392" height="44" rx="6" fill="#1e1f25" stroke="#5e6ad2"/>
  <text x="552" y="265" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#c9cdd6">[occurrence] deployment: acme &#183; source: slack</text>
  <text x="552" y="281" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#6b6f76">2026-07-08 &#183; just now</text>

  <text x="536" y="330" font-size="13" font-weight="700" fill="#7c84e8">3 occurrences &#183; 2 deployments</text>
  <text x="536" y="354" font-size="11" fill="#6b6f76">one ticket, one root cause &#183; counted by the weekly digest</text>
</svg>
